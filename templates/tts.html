<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voiceover Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-6">

    <!-- Back Button -->
    <a href="/" class="inline-flex items-center text-gray-400 hover:text-white transition-colors mb-8">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to Index
    </a>

    <div class="max-w-3xl mx-auto glass-panel rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Realistic AI Voiceover</h1>
        <p class="text-gray-400 mb-6 text-sm">NotebookLM Style Contextual Audio Generation (100% Free)</p>

        <div class="space-y-6">
            <!-- Text Input -->
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Paste your text here</label>
                <textarea id="textInput" rows="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all placeholder-gray-500" placeholder="Hello guys! Today we are going to learn about..."></textarea>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Select Tone</label>
                    <select id="toneSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500">
                        <option value="auto">✨ Auto Detect (Smart)</option>
                        <option value="podcast">🎙️ Podcast (Adds hmm, aww, umm)</option>
                        <option value="fact">📚 Fact & Educational</option>
                        <option value="energetic">🔥 Energetic & Exciting</option>
                        <option value="news">📰 News Reporter</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Select Voice Artist</label>
                    <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white focus:ring-2 focus:ring-blue-500">
                        <option value="female_nova">👩 Female (Nova Style - Aria)</option>
                        <option value="female_jenny">👩 Female (Sweet - Jenny)</option>
                        <option value="male_guy">👨 Male (Deep - Guy)</option>
                        <option value="male_chris">👨 Male (Energetic - Chris)</option>
                        <option value="female_news">👩 Female (News - Michelle)</option>
                        <option value="male_news">👨 Male (News - Eric)</option>
                    </select>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" onclick="generateAudio()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-4 rounded-xl transition-all shadow-lg hover:shadow-blue-500/30 flex justify-center items-center">
                <span id="btnText">Generate Realistic Audio</span>
                <svg id="loadingIcon" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>

            <!-- Result Section -->
            <div id="resultSection" class="hidden mt-6 pt-6 border-t border-slate-700">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm text-green-400 bg-green-400/10 px-3 py-1 rounded-full border border-green-400/20" id="detectedToneBadge">Tone: Podcast</span>
                </div>
                <audio id="audioPlayer" controls class="w-full h-12 rounded-lg outline-none"></audio>
                <p class="text-xs text-gray-500 mt-3">Final processed script (Fillers added automatically):</p>
                <p id="processedScript" class="text-sm text-gray-400 mt-1 italic p-3 bg-slate-800/50 rounded-lg"></p>
            </div>
        </div>
    </div>

    <script>
        async function generateAudio() {
            const text = document.getElementById('textInput').value;
            const tone = document.getElementById('toneSelect').value;
            const voice = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loadingIcon');
            const resultSection = document.getElementById('resultSection');

            if (!text.trim()) {
                alert("Please enter some text!");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btn.classList.add('opacity-75');
            btnText.innerText = 'Analyzing & Generating...';
            loader.classList.remove('hidden');
            resultSection.classList.add('hidden');

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, tone, voice })
                });

                const data = await response.json();

                if (response.ok) {
                    // Cache buster for audio player (force reload)
                    document.getElementById('audioPlayer').src = data.audio_url + "?t=" + new Date().getTime();
                    document.getElementById('detectedToneBadge').innerText = "Applied Tone: " + data.detected_tone.toUpperCase();
                    document.getElementById('processedScript').innerText = '"' + data.processed_script + '"';
                    resultSection.classList.remove('hidden');
                    document.getElementById('audioPlayer').play();
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                alert("An error occurred!");
                console.error(error);
            } finally {
                // Restore UI
                btn.disabled = false;
                btn.classList.remove('opacity-75');
                btnText.innerText = 'Generate Realistic Audio';
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
